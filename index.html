<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinite Love - Mobin & Niyayesh</title>
<style>
/* RESET & FULLSCREEN SETUP */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
width: 100%;
height: 100%;
overflow: hidden;
background-color: #fdfbf7; /* Warm watercolor paper base */
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Vazirmatn", "Tahoma", sans-serif;
touch-action: none; /* Prevent browser handling of gestures */
user-select: none;
-webkit-user-select: none;
}
canvas {
display: block;
width: 100%;
height: 100%;
cursor: crosshair;
}
#ui-layer {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
transition: opacity 2s ease-in-out;
}
.instruction {
color: rgba(26, 42, 108, 0.5);
font-size: 1.2rem;
letter-spacing: 2px;
text-align: center;
animation: pulse 3s infinite alternate;
font-style: italic;
}
@keyframes pulse {
0% { opacity: 0.3; transform: scale(0.98); }
100% { opacity: 0.8; transform: scale(1.02); }
}
#hud {
position: absolute;
top: 20px;
right: 20px;
color: rgba(178, 121, 167, 0.8);
font-size: 1rem;
pointer-events: none;
text-align: right;
opacity: 0;
transition: opacity 1s ease;
}
</style>
</head>
<body>
<div id="ui-layer">
<div class="instruction">Scroll, Pinch, or Double Tap to journey forever...</div>
</div>
<div id="hud">
<span id="heart-count">0</span> ❤️
</div>
<canvas id="universe"></canvas>
<script>
/**
 * INFINITE ROMANTIC UNIVERSE
 * A procedural, interactive watercolor artwork.
 * From Mobin to his angel, Niyayesh.
 *    * Architecture:
 *    * Custom infinite 3D camera mapping Z depth to exponential scale.
 *    * Spatial partitioning via "Chunks" based on integer Z levels.
 *    * Procedural watercolor rendering using globalCompositeOperation 'multiply' and low alpha.
 *    * Hardware-agnostic game loop with delta-time for consistent 60FPS physics.
     */
// ==========================================
// CORE CONFIGURATION & STATE
// ==========================================
const canvas = document.getElementById('universe');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize by disabling alpha on root context
let width, height, cx, cy;
let resScale = 1; // Responsive scaling factor
// Palette
const PALETTE = {
deepBlue: '#1a2a6c', lavender: '#b279a7', softPink: '#ffb6c1',
warmCream: '#fdfbf7', gold: '#ffd700', purple: '#800080',
lightCyan: '#e0ffff', sunsetOrange: '#fd7e14', ink: '#2c3e50'
};
// Camera State
const camera = {
x: 0, y: 0, z: 0,
targetX: 0, targetY: 0, targetZ: 0,
autoZoom: false
};
// Game State
let time = 0;
let lastTime = performance.now();
let score = 0;
let activeParticles = [];
let interactables = [];
let clickPos = null;
// ==========================================
// UTILITIES & PROCEDURAL MATH
// ==========================================
class RNG {
constructor(seed) {
this.m = 0x80000000; this.a = 1103515245; this.c = 12345;
this.state = seed ? seed : Math.floor(Math.random() * (this.m - 1));
}
nextFloat() {
this.state = (this.a * this.state + this.c) % this.m;
return this.state / (this.m - 1);
}
range(min, max) { return min + this.nextFloat() * (max - min); }
}
function lerp(start, end, amt) {
return (1 - amt) * start + amt * end;
}
// Generate organic paper texture offscreen to save frame time
const textureCanvas = document.createElement('canvas');
const tCtx = textureCanvas.getContext('2d');
function buildPaperTexture() {
textureCanvas.width = width;
textureCanvas.height = height;
tCtx.fillStyle = PALETTE.warmCream;
tCtx.fillRect(0, 0, width, height);
// Add subtle procedural noise for paper grain
const imgData = tCtx.getImageData(0, 0, width, height);
const data = imgData.data;
for(let i = 0; i < data.length; i += 4) {
let noise = (Math.random() - 0.5) * 12;
data[i] += noise; data[i+1] += noise; data[i+2] += noise;
}
tCtx.putImageData(imgData, 0, 0);
}
// Resize Handler
function resize() {
width = window.innerWidth;
height = window.innerHeight;
canvas.width = width;
canvas.height = height;
cx = width / 2;
cy = height / 2;
resScale = Math.min(width, height) / 800; // Normalize sizing across devices
buildPaperTexture();
}
window.addEventListener('resize', resize);
resize();
// ==========================================
// INPUT HANDLING
// ==========================================
let isDragging = false;
let lastTouch = { x: 0, y: 0 };
let pinchDist = null;
let lastTap = 0;
// Mouse
window.addEventListener('mousedown', e => {
isDragging = true; lastTouch.x = e.clientX; lastTouch.y = e.clientY;
});
window.addEventListener('mousemove', e => {
if(isDragging) {
let dx = e.clientX - lastTouch.x; let dy = e.clientY - lastTouch.y;
camera.targetX -= dx * 1.5; camera.targetY -= dy * 1.5;
lastTouch.x = e.clientX; lastTouch.y = e.clientY;
}
});
window.addEventListener('mouseup', e => {
isDragging = false;
clickPos = { x: e.clientX, y: e.clientY };
});
window.addEventListener('wheel', e => {
camera.targetZ += e.deltaY * 0.0015;
camera.targetZ = Math.max(0, camera.targetZ); // Prevent zooming behind start
document.getElementById('ui-layer').style.opacity = 0;
});
window.addEventListener('dblclick', () => {
camera.autoZoom = !camera.autoZoom;
document.getElementById('ui-layer').style.opacity = 0;
});
// Touch
canvas.addEventListener('touchstart', e => {
if (e.touches.length === 1) {
isDragging = true;
lastTouch.x = e.touches[0].clientX; lastTouch.y = e.touches[0].clientY;
} else if (e.touches.length === 2) {
pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}
document.getElementById('ui-layer').style.opacity = 0;
}, {passive: false});
canvas.addEventListener('touchmove', e => {
e.preventDefault(); // Stop native scrolling
if (e.touches.length === 1 && isDragging) {
let dx = e.touches[0].clientX - lastTouch.x; let dy = e.touches[0].clientY - lastTouch.y;
camera.targetX -= dx * 1.5; camera.targetY -= dy * 1.5;
lastTouch.x = e.touches[0].clientX; lastTouch.y = e.touches[0].clientY;
} else if (e.touches.length === 2 && pinchDist) {
let newDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
camera.targetZ += (pinchDist - newDist) * 0.01;
camera.targetZ = Math.max(0, camera.targetZ);
pinchDist = newDist;
}
}, {passive: false});
canvas.addEventListener('touchend', e => {
if(e.touches.length < 2) pinchDist = null;
if(e.touches.length === 0) {
isDragging = false;
let now = Date.now();
if (now - lastTap < 300) camera.autoZoom = !camera.autoZoom;
else clickPos = { x: lastTouch.x, y: lastTouch.y };
lastTap = now;
}
});
// ==========================================
// ENTITY SYSTEM
// ==========================================
// Base class for renderable objects
class Entity {
constructor(x, y, z) { this.x = x; this.y = y; this.z = z; }
update(dt, t) {}
draw(ctx, sx, sy, scale, alpha) {}
}
class TextEntity extends Entity {
constructor(x, y, z, text, fontStyle, color, isWatercolor = false) {
super(x, y, z);
this.lines = text.split('\n');
this.fontStyle = fontStyle;
this.color = color;
this.isWatercolor = isWatercolor;
}
draw(ctx, sx, sy, scale, alpha) {
ctx.save();
ctx.translate(sx, sy);
ctx.scale(scale, scale);
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
let fontSize = parseInt(this.fontStyle) || 40;
ctx.font = this.fontStyle;
let startY = -(this.lines.length - 1) * (fontSize * 1.5) / 2;
if (this.isWatercolor) {
ctx.globalCompositeOperation = 'multiply';
for (let j = 0; j < 3; j++) {
ctx.globalAlpha = alpha * 0.3;
ctx.fillStyle = this.color;
let jx = Math.sin(time*2 + j) * 2;
let jy = Math.cos(time*2 + j) * 2;
this.lines.forEach((line, i) => ctx.fillText(line, jx, startY + i * (fontSize * 1.5) + jy));
}
} else {
ctx.globalAlpha = alpha;
ctx.fillStyle = this.color;
ctx.shadowColor = 'rgba(0,0,0,0.1)';
ctx.shadowBlur = 10;
this.lines.forEach((line, i) => ctx.fillText(line, 0, startY + i * (fontSize * 1.5)));
}
ctx.restore();
}
}
class RoseEntity extends Entity {
constructor(x, y, z) {
super(x, y, z);
this.petals = [];
for(let i = 0; i < 70; i++) {
// Fermat's spiral for natural packing
this.petals.push({
a: i * 2.39996, // Golden angle
r: Math.sqrt(i) * 12,
s: 15 + i * 0.5,
c: [PALETTE.softPink, PALETTE.sunsetOrange, PALETTE.lavender][i % 3]
});
}
}
draw(ctx, sx, sy, scale, alpha) {
ctx.save();
ctx.translate(sx, sy);
ctx.scale(scale, scale);
ctx.rotate(time * 0.1); // Slow spin
ctx.globalCompositeOperation = 'multiply';
this.petals.forEach((p, i) => {
let bloom = 1 + Math.sin(time + i * 0.1) * 0.15; // Gentle breathing
let px = Math.cos(p.a) * p.r * bloom;
let py = Math.sin(p.a) * p.r * bloom;
ctx.globalAlpha = alpha * 0.6;
ctx.fillStyle = p.c;
ctx.beginPath();
ctx.ellipse(px, py, p.s * bloom, p.s * bloom * 0.7, p.a, 0, Math.PI * 2);
ctx.fill();
});
ctx.restore();
}
}
class PaperPlaneEntity extends Entity {
constructor(x, y, z) { super(x, y, z); this.localTime = 0; }
update(dt, t) {
this.localTime += dt;
this.x += Math.cos(this.localTime * 0.5) * 2;
this.y += Math.sin(this.localTime * 0.8) * 1;
// Occasionally drop a heart
if (Math.random() < 0.02) activeParticles.push(new Particle(this.x, this.y, this.z, PALETTE.softPink, true));
}
draw(ctx, sx, sy, scale, alpha) {
ctx.save();
ctx.translate(sx, sy);
ctx.scale(scale, scale);
ctx.rotate(Math.sin(this.localTime * 0.5) * 0.2);
ctx.globalAlpha = alpha;
ctx.fillStyle = '#fff';
ctx.shadowColor = 'rgba(0,0,0,0.15)';
ctx.shadowBlur = 15;
// Origami plane geometry
ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(20, 30); ctx.lineTo(0, 15); ctx.lineTo(-20, 30); ctx.closePath();
ctx.fill();
// Fold line
ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, 15);
ctx.strokeStyle = '#eee'; ctx.lineWidth = 1; ctx.stroke();
ctx.restore();
}
}
class CloudEntity extends Entity {
constructor(x, y, z) {
super(x, y, z);
this.blobs = [];
for(let i=0; i<5; i++) {
this.blobs.push({
ox: (Math.random()-0.5)*150, oy: (Math.random()-0.5)*50,
r: 40 + Math.random()*60
});
}
}
update(dt) { this.x += dt * 5; }
draw(ctx, sx, sy, scale, alpha) {
ctx.save(); ctx.translate(sx, sy); ctx.scale(scale, scale);
ctx.globalCompositeOperation = 'screen';
ctx.fillStyle = PALETTE.lightCyan;
this.blobs.forEach(b => {
ctx.globalAlpha = alpha * 0.15;
ctx.beginPath(); ctx.arc(b.ox, b.oy, b.r, 0, Math.PI*2); ctx.fill();
});
ctx.restore();
}
}
class LanternEntity extends Entity {
constructor(x, y, z) { super(x, y, z); this.offset = Math.random()*100; }
update(dt, t) { this.y -= dt * 20; this.x += Math.sin(t + this.offset) * 0.5; }
draw(ctx, sx, sy, scale, alpha) {
ctx.save(); ctx.translate(sx, sy); ctx.scale(scale, scale);
// Glow
let grad = ctx.createRadialGradient(0,0,5, 0,0,40);
grad.addColorStop(0, rgba(253, 126, 20, ${alpha}));
grad.addColorStop(1, 'rgba(253, 126, 20, 0)');
ctx.fillStyle = grad;
ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
// Body
ctx.globalAlpha = alpha * 0.8;
ctx.fillStyle = '#ffcc00';
ctx.beginPath(); ctx.roundRect(-15, -25, 30, 50, 5); ctx.fill();
ctx.restore();
}
}
class ButterflyEntity extends Entity {
constructor(x, y, z) { super(x, y, z); this.t = Math.random()*10; this.c = [PALETTE.lavender, PALETTE.softPink, PALETTE.lightCyan][Math.floor(Math.random()*3)]; }
update(dt) {
this.t += dt * 15;
this.x += Math.cos(this.t*0.1)*3; this.y -= dt*10;
}
draw(ctx, sx, sy, scale, alpha) {
ctx.save(); ctx.translate(sx, sy); ctx.scale(scale, scale);
ctx.rotate(Math.cos(this.t*0.1)*0.5);
ctx.globalCompositeOperation = 'multiply';
ctx.globalAlpha = alpha * 0.7;
ctx.fillStyle = this.c;
let flap = Math.max(0.1, Math.abs(Math.cos(this.t)));
// Left wing
ctx.beginPath(); ctx.ellipse(-15*flap, 0, 15*flap, 20, -Math.PI/6, 0, Math.PI*2); ctx.fill();
// Right wing
ctx.beginPath(); ctx.ellipse(15*flap, 0, 15*flap, 20, Math.PI/6, 0, Math.PI*2); ctx.fill();
ctx.restore();
}
}
class GalaxyEntity extends Entity {
constructor(x, y, z) {
super(x, y, z);
this.stars = [];
let rng = new RNG(123);
for(let i=0; i<400; i++) {
let arm = rng.range(0, 3) | 0;
let dist = rng.range(0, 500);
let angle = dist * 0.02 + (arm * Math.PI * 2 / 3);
angle += rng.range(-0.2, 0.2); // noise
this.stars.push({ d: dist, a: angle, s: rng.range(1, 4), c: (rng.nextFloat()>0.5) ? PALETTE.lightCyan : PALETTE.lavender });
}
}
draw(ctx, sx, sy, scale, alpha) {
ctx.save(); ctx.translate(sx, sy); ctx.scale(scale, scale);
ctx.rotate(time * 0.02);
ctx.globalCompositeOperation = 'screen';
this.stars.forEach(s => {
let px = Math.cos(s.a) * s.d;
let py = Math.sin(s.a) * s.d;
ctx.globalAlpha = alpha * (1 - s.d/500);
ctx.fillStyle = s.c;
ctx.beginPath(); ctx.arc(px, py, s.s, 0, Math.PI*2); ctx.fill();
});
ctx.restore();
}
}
class ConstellationHeart extends Entity {
constructor(x, y, z) {
super(x, y, z);
this.pts = [];
for(let t=0; t<Math.PI*2; t+=0.3) {
// Heart math
let hx = 16 * Math.pow(Math.sin(t), 3);
let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
this.pts.push({ x: hx*15, y: hy*15, offset: Math.random()*Math.PI*2 });
}
}
draw(ctx, sx, sy, scale, alpha) {
ctx.save(); ctx.translate(sx, sy); ctx.scale(scale, scale);
ctx.globalAlpha = alpha * 0.8;
ctx.strokeStyle = PALETTE.gold;
ctx.lineWidth = 1;
ctx.beginPath();
this.pts.forEach((p, i) => {
let flicker = 1 + Math.sin(time*2 + p.offset)*0.2;
let px = p.x * flicker; let py = p.y * flicker;
if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
// Draw star at vertex
ctx.fillStyle = '#fff';
ctx.fillRect(px-2, py-2, 4, 4);
});
ctx.closePath(); ctx.stroke();
ctx.restore();
}
}
class HeartCollectible extends Entity {
constructor(x, y, z) { super(x, y, z); this.collected = false; this.t = Math.random()*10; }
update(dt) { this.t += dt; this.y += Math.sin(this.t * 2) * 0.5; }
draw(ctx, sx, sy, scale, alpha) {
if(this.collected) return;
let s = scale * (1 + Math.sin(this.t * 4)*0.1); // Beating
ctx.save(); ctx.translate(sx, sy); ctx.scale(s, s);
ctx.globalAlpha = alpha; ctx.fillStyle = PALETTE.sunsetOrange;
ctx.shadowColor = PALETTE.softPink; ctx.shadowBlur = 10;
ctx.beginPath();
ctx.moveTo(0, -3);
ctx.bezierCurveTo(0, -10, -10, -10, -10, -3);
ctx.bezierCurveTo(-10, 2, 0, 6, 0, 10);
ctx.bezierCurveTo(0, 6, 10, 2, 10, -3);
ctx.bezierCurveTo(10, -10, 0, -10, 0, -3);
ctx.fill();
ctx.restore();
// Register for click detection
interactables.push({ obj: this, x: sx, y: sy, r: 20 * scale });
}
}
class Particle {
constructor(x, y, z, c, isHeart = false) {
this.x=x; this.y=y; this.z=z; this.c=c; this.isHeart = isHeart;
this.vx = (Math.random()-0.5)*100;
this.vy = (Math.random()-0.5)*100;
this.vz = (Math.random()-0.5)*0.5;
this.life = 1.0;
}
update(dt) {
this.x += this.vx * dt; this.y += this.vy * dt; this.z += this.vz * dt;
this.life -= dt * 0.5;
}
draw(ctx, camera, resScale) {
let scale = Math.pow(2.5, camera.z - this.z) * resScale;
if(scale < 0.01 || scale > 30) return;
let sx = cx + (this.x - camera.x) * scale;
let sy = cy + (this.y - camera.y) * scale;
ctx.globalAlpha = this.life;
ctx.fillStyle = this.c;
if (this.isHeart) {
ctx.save(); ctx.translate(sx, sy); ctx.scale(scale*0.5, scale*0.5);
ctx.beginPath(); ctx.moveTo(0, -3); ctx.bezierCurveTo(0, -10, -10, -10, -10, -3); ctx.bezierCurveTo(-10, 2, 0, 6, 0, 10); ctx.bezierCurveTo(0, 6, 10, 2, 10, -3); ctx.bezierCurveTo(10, -10, 0, -10, 0, -3); ctx.fill();
ctx.restore();
} else {
ctx.beginPath(); ctx.arc(sx, sy, 3*scale, 0, Math.PI*2); ctx.fill();
}
}
}
// ==========================================
// PROCEDURAL WORLD GENERATION
// ==========================================
const ROMANTIC_QUOTES = [
"Forever begins with you.",
"Every heartbeat whispers your name.",
"تو خانه‌ی قلب منی.",
"Love has no end.",
"هر زوم،\nیک دلیل دیگر برای دوست داشتنت.",
"The universe is still too small for my love.",
"You are my favorite dream.",
"در هر جهان ممکنی،\nباز هم تو را انتخاب می‌کردم."
];
class World {
constructor() {
this.chunks = new Map();
}
getChunk(zIdx) {
if (!this.chunks.has(zIdx)) {
this.chunks.set(zIdx, this.generateChunk(zIdx));
}
return this.chunks.get(zIdx);
}
generateChunk(z) {
let entities = [];
let rng = new RNG(z * 987654);
// HARDCODED LEVELS (0 to 9)
if (z === 0) {
entities.push(new TextEntity(0, 0, 0, "Niyayesh", "italic 80px 'Georgia', serif", PALETTE.lavender, true));
}
else if (z === 1) {
entities.push(new RoseEntity(0, 0, 1));
}
else if (z === 2) {
entities.push(new PaperPlaneEntity(-200, 100, 2));
for(let i=0; i<3; i++) entities.push(new CloudEntity(rng.range(-400,400), rng.range(-300,300), 2.1));
}
else if (z === 3) {
const letterText = "نیایش…\nشاید نتوانم تمام احساسم را در چند خط بنویسم،\nاما اگر این دنیا بی‌انتها باشد،\nباز هم برای دوست داشتن تو کافی نیست.\n\nتو آرامش تمام روزهای شلوغ منی.\nتو دلیل لبخندهایی هستی که حتی خودم متوجهشان نمی‌شوم.\n\nاگر هزار دنیا وجود داشته باشد،\nباز هم همه را انتخاب می‌کنم،\nفقط اگر تو در یکی از آن‌ها باشی.\n\nWith all my heart,\nMobin";
entities.push(new TextEntity(0, 0, 3, letterText, "24px 'Georgia', serif", PALETTE.ink, false));
}
else if (z === 4) {
for(let i=0; i<15; i++) entities.push(new CloudEntity(rng.range(-800,800), rng.range(-600,600), 4 + rng.nextFloat()));
}
else if (z === 5) {
for(let i=0; i<40; i++) entities.push(new LanternEntity(rng.range(-800,800), rng.range(0, 1000), 5 + rng.nextFloat()));
}
else if (z === 6) {
// Magical Forest abstracted
for(let i=0; i<50; i++) {
entities.push(new TextEntity(rng.range(-1000,1000), rng.range(-1000,1000), 6 + rng.nextFloat(), "🌲", "100px Arial", PALETTE.deepBlue, true));
}
}
else if (z === 7) {
for(let i=0; i<100; i++) entities.push(new ButterflyEntity(rng.range(-800,800), rng.range(-800,800), 7 + rng.nextFloat()));
}
else if (z === 8) {
entities.push(new GalaxyEntity(0, 0, 8));
}
else if (z === 9) {
entities.push(new ConstellationHeart(0, 0, 9));
}
// PROCEDURAL INFINITE LEVELS (10+)
else {
let theme = rng.range(0, 100);
let count = rng.range(20, 80);
for (let i=0; i<count; i++) {
let ex = rng.range(-1200, 1200);
let ey = rng.range(-1200, 1200);
let ez = z + rng.nextFloat();
if (theme < 25) entities.push(new LanternEntity(ex, ey, ez));
else if (theme < 50) entities.push(new ButterflyEntity(ex, ey, ez));
else if (theme < 75) entities.push(new CloudEntity(ex, ey, ez));
else entities.push(new ConstellationHeart(ex, ey, ez)); // scattered tiny hearts
}
// Inject random romantic quotes
if (z % 3 === 0) {
let q = ROMANTIC_QUOTES[Math.floor(rng.nextFloat() * ROMANTIC_QUOTES.length)];
entities.push(new TextEntity(0, 0, z + 0.5, q, "italic 36px 'Georgia', serif", PALETTE.purple, true));
}
// The very distant hidden ending text
if (z > 20 && z % 15 === 0 && rng.nextFloat() > 0.5) {
entities.push(new TextEntity(0, 200, z + 0.8, "از طرف مبین،\nبه فرشته‌اش…\nنیایش.", "italic 40px 'Georgia', serif", PALETTE.deepBlue, false));
}
}
// Always add a few collectibles
for(let i=0; i<4; i++) {
entities.push(new HeartCollectible(rng.range(-600, 600), rng.range(-600, 600), z + rng.nextFloat()));
}
return entities;
}
update(dt, t) {
let cz = Math.floor(camera.z);
// Only update nearby chunks
for(let i = cz - 2; i <= cz + 3; i++) {
if(i >= 0) this.getChunk(i).forEach(e => e.update(dt, t));
}
// Clean up old chunks to prevent infinite memory usage
for (let key of this.chunks.keys()) {
if (Math.abs(key - camera.z) > 10) this.chunks.delete(key);
}
}
draw(ctx) {
let cz = Math.floor(camera.z);
// Draw from furthest to closest for correct depth perception
// Furthest chunks have LARGER Z values (we are zooming IN towards higher Z)
// Wait, if Z is depth into the screen, object at Z=10 is FAR away if Camera=0.
// As Camera approaches 10, it gets closer.
// So furthest object has highest Z. Draw highest Z first!
for(let i = cz + 4; i >= cz - 2; i--) {
if(i < 0) continue;
let chunk = this.getChunk(i);
// Sort entities within chunk by Z
chunk.sort((a,b) => b.z - a.z);
chunk.forEach(e => {
// Exponential Scale Formula
let scale = Math.pow(2.5, camera.z - e.z) * resScale;
// Frustum Culling
if (scale < 0.02 || scale > 25) return;
// Screen boundaries check (approximate)
let sx = cx + (e.x - camera.x) * scale;
let sy = cy + (e.y - camera.y) * scale;
if (sx < -width || sx > width*2 || sy < -height || sy > height*2) return;
// Alpha fading based on distance
let alpha = 1;
if (scale < 0.2) alpha = (scale - 0.02) / 0.18; // Fade in far away
if (scale > 5) alpha = 1 - ((scale - 5) / 20);  // Fade out as it passes camera
if (alpha <= 0) return;
e.draw(ctx, sx, sy, scale, alpha);
});
}
}
}
const world = new World();
// ==========================================
// MAIN LOOP
// ==========================================
function loop() {
let now = performance.now();
let dt = (now - lastTime) / 1000;
lastTime = now;
if (dt > 0.1) dt = 0.1; // Cap delta to avoid physics explosions
time += dt;
// --- LOGIC UPDATE ---
// Auto zoom
if (camera.autoZoom) camera.targetZ += 0.3 * dt;
// Soft center bounds so user doesn't drift into empty void infinitely on X/Y
camera.targetX *= (1 - 0.5 * dt);
camera.targetY *= (1 - 0.5 * dt);
// Inertia Camera
camera.x += (camera.targetX - camera.x) * 5 * dt;
camera.y += (camera.targetY - camera.y) * 5 * dt;
camera.z += (camera.targetZ - camera.z) * 5 * dt;
interactables = []; // Reset interaction array
world.update(dt, time);
// Particle update
for(let i = activeParticles.length - 1; i >= 0; i--) {
activeParticles[i].update(dt);
if(activeParticles[i].life <= 0) activeParticles.splice(i, 1);
}
// --- RENDERING ---
// 1. Base Paper
ctx.globalCompositeOperation = 'source-over';
ctx.globalAlpha = 1;
ctx.drawImage(textureCanvas, 0, 0, width, height);
// Decorative global effects based on collected hearts
if (score > 5) {
ctx.globalCompositeOperation = 'overlay';
let grad = ctx.createLinearGradient(0,0,width,height);
grad.addColorStop(0, rgba(255, 182, 193, ${Math.sin(time)*0.05 + 0.05}));
grad.addColorStop(1, rgba(178, 121, 167, ${Math.cos(time)*0.05 + 0.05}));
ctx.fillStyle = grad;
ctx.fillRect(0,0,width,height);
}
// 2. Draw World
ctx.globalCompositeOperation = 'source-over';
world.draw(ctx);
// 3. Draw Particles
ctx.globalCompositeOperation = 'source-over';
activeParticles.forEach(p => p.draw(ctx, camera, resScale));
// --- INTERACTION CHECK ---
if (clickPos) {
for(let item of interactables) {
let dist = Math.hypot(item.x - clickPos.x, item.y - clickPos.y);
if (dist < item.r + 20) {
item.obj.collected = true;
score++;
document.getElementById('hud').style.opacity = 1;
document.getElementById('heart-count').innerText = score;
// Explosion
for(let i=0; i<15; i++) activeParticles.push(new Particle(item.obj.x, item.obj.y, item.obj.z, PALETTE.sunsetOrange));
break; // Only collect one per tap
}
}
clickPos = null;
}
requestAnimationFrame(loop);
}
// Start
requestAnimationFrame(loop);
</script>
