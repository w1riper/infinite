
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برای نیایش</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            font-family: Georgia, serif;
            background: #1a1a2e;
            touch-action: none;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #ui {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui"></div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const ui = document.getElementById('ui');
        
        let width, height, dpr;
        
        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
        }
        
        resize();
        window.addEventListener('resize', resize);
        
        // Camera system
        const camera = {
            x: 0,
            y: 0,
            zoom: 1,
            targetZoom: 1,
            vx: 0,
            vy: 0,
            minZoom: 0.5,
            maxZoom: 1000000
        };
        
        // Input handling
        let pointers = [];
        let isDragging = false;
        let lastDist = 0;
        
        function getPointer(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (width / rect.width),
                y: (e.clientY - rect.top) * (height / rect.height),
                id: e.pointerId
            };
        }
        
        function getTouchCenter() {
            if (pointers.length === 0) return null;
            let x = 0, y = 0;
            pointers.forEach(p => { x += p.x; y += p.y; });
            return { x: x / pointers.length, y: y / pointers.length };
        }
        
        function getTouchDistance() {
            if (pointers.length < 2) return 0;
            const dx = pointers[0].x - pointers[1].x;
            const dy = pointers[0].y - pointers[1].y;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        canvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            const p = getPointer(e);
            pointers.push(p);
            isDragging = true;
            if (pointers.length === 2) {
                lastDist = getTouchDistance();
            }
        });
        
        canvas.addEventListener('pointermove', e => {
            e.preventDefault();
            const p = getPointer(e);
            const idx = pointers.findIndex(ptr => ptr.id === p.id);
            if (idx === -1) return;
            
            if (pointers.length === 1 && isDragging) {
                const dx = p.x - pointers[0].x;
                const dy = p.y - pointers[0].y;
                camera.vx = dx * 0.3;
                camera.vy = dy * 0.3;
                camera.x -= dx / camera.zoom;
                camera.y -= dy / camera.zoom;
            } else if (pointers.length === 2) {
                const oldCenter = getTouchCenter();
                pointers[idx] = p;
                const newCenter = getTouchCenter();
                const newDist = getTouchDistance();
                
                if (lastDist > 0) {
                    const zoomFactor = newDist / lastDist;
                    const oldZoom = camera.zoom;
                    camera.targetZoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * zoomFactor));
                    camera.zoom = camera.targetZoom;
                    
                    const worldX = (oldCenter.x - width / 2) / oldZoom + camera.x;
                    const worldY = (oldCenter.y - height / 2) / oldZoom + camera.y;
                    camera.x = worldX - (oldCenter.x - width / 2) / camera.zoom;
                    camera.y = worldY - (oldCenter.y - height / 2) / camera.zoom;
                }
                lastDist = newDist;
                return;
            }
            
            pointers[idx] = p;
        });
        
        canvas.addEventListener('pointerup', e => {
            const idx = pointers.findIndex(p => p.id === e.pointerId);
            if (idx !== -1) pointers.splice(idx, 1);
            if (pointers.length === 0) isDragging = false;
            if (pointers.length < 2) lastDist = 0;
        });
        
        canvas.addEventListener('pointercancel', e => {
            const idx = pointers.findIndex(p => p.id === e.pointerId);
            if (idx !== -1) pointers.splice(idx, 1);
            if (pointers.length === 0) isDragging = false;
            if (pointers.length < 2) lastDist = 0;
        });
        
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomSpeed = 0.001;
            const delta = -e.deltaY * zoomSpeed;
            const oldZoom = camera.zoom;
            camera.targetZoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * (1 + delta)));
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (width / rect.width);
            const mouseY = (e.clientY - rect.top) * (height / rect.height);
            
            const worldX = (mouseX - width / 2) / oldZoom + camera.x;
            const worldY = (mouseY - height / 2) / oldZoom + camera.y;
            camera.x = worldX - (mouseX - width / 2) / camera.targetZoom;
            camera.y = worldY - (mouseY - height / 2) / camera.targetZoom;
        }, { passive: false });
        
        // Double tap to zoom
        let lastTap = 0;
        canvas.addEventListener('dblclick', e => {
            const now = Date.now();
            if (now - lastTap < 300) {
                const oldZoom = camera.zoom;
                camera.targetZoom = oldZoom < 2 ? oldZoom * 2 : 1;
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) * (width / rect.width);
                const mouseY = (e.clientY - rect.top) * (height / rect.height);
                const worldX = (mouseX - width / 2) / oldZoom + camera.x;
                const worldY = (mouseY - height / 2) / oldZoom + camera.y;
                camera.x = worldX - (mouseX - width / 2) / camera.targetZoom;
                camera.y = worldY - (mouseY - height / 2) / camera.targetZoom;
            }
            lastTap = now;
        });
        
        // Seeded random for procedural generation
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }
        
        function hash(x, y, seed = 0) {
            return seededRandom(x * 12.9898 + y * 78.233 + seed * 43758.5453);
        }
        
        // Color palette
        const colors = {
            deepBlue: [31, 58, 147],
            lavender: [181, 159, 217],
            softPink: [255, 182, 193],
            warmCream: [255, 245, 220],
            gold: [255, 215, 0],
            purple: [147, 112, 219],
            lightCyan: [224, 255, 255],
            sunsetOrange: [255, 140, 105],
            white: [255, 255, 255]
        };
        
        function mixColors(c1, c2, ratio) {
            return [
                c1[0] + (c2[0] - c1[0]) * ratio,
                c1[1] + (c2[1] - c1[1]) * ratio,
                c1[2] + (c2[2] - c1[2]) * ratio
            ];
        }
        
        function colorToString(c, alpha = 1) {
            return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${alpha})`;
        }
        
        // Watercolor texture generator
        function createWatercolorTexture(size, baseColor, seed) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');
            
            const imageData = tempCtx.createImageData(size, size);
            const data = imageData.data;
            
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = (y * size + x) * 4;
                    const noise = hash(x * 0.1, y * 0.1, seed) * 0.3 + 
                                 hash(x * 0.05, y * 0.05, seed + 1) * 0.4 +
                                 hash(x * 0.02, y * 0.02, seed + 2) * 0.3;
                    
                    data[idx] = baseColor[0] + (noise - 0.5) * 50;
                    data[idx + 1] = baseColor[1] + (noise - 0.5) * 50;
                    data[idx + 2] = baseColor[2] + (noise - 0.5) * 50;
                    data[idx + 3] = 255 * (0.6 + noise * 0.4);
                }
            }
            
            tempCtx.putImageData(imageData, 0, 0);
            return tempCanvas;
        }
        
        // Particle system
        class Particle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
            }
            
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 0.01 * dt;
                this.life -= dt;
                return this.life > 0;
            }
            
            render(ctx, cam) {
                const screenX = (this.x - cam.x) * cam.zoom + width / 2;
                const screenY = (this.y - cam.y) * cam.zoom + height / 2;
                const alpha = this.life / this.maxLife;
                
                ctx.fillStyle = colorToString(this.color, alpha * 0.6);
                ctx.beginPath();
                ctx.arc(screenX, screenY, this.size * cam.zoom, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        const particles = [];
        
        function addParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.5 + 0.2;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color,
                    Math.random() * 3 + 1,
                    Math.random() * 60 + 30
                ));
            }
        }
        
        // Content generation based on zoom level
        function getZoomLevel() {
            return Math.log10(camera.zoom + 1);
        }
        
        function drawWatercolorText(text, x, y, size, color, alpha = 1) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -500 || screenX > width + 500 || screenY < -500 || screenY > height + 500) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            
            // Shadow layers for watercolor effect
            for (let i = 3; i > 0; i--) {
                ctx.fillStyle = colorToString(color, alpha * 0.15 * i);
                ctx.font = `${screenSize * (1 + i * 0.1)}px Georgia`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, i * 2, i * 2);
            }
            
            // Main text
            ctx.fillStyle = colorToString(color, alpha);
            ctx.font = `${screenSize}px Georgia`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 0, 0);
            
            ctx.restore();
        }
        
        function drawWatercolorCircle(x, y, radius, color, alpha = 1) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenRadius = radius * camera.zoom;
            
            if (screenX < -screenRadius || screenX > width + screenRadius || 
                screenY < -screenRadius || screenY > height + screenRadius) return;
            
            // Multiple layers for watercolor effect
            for (let i = 0; i < 5; i++) {
                const offset = i * 3;
                const rad = screenRadius + offset;
                const layerAlpha = alpha * (0.3 - i * 0.05);
                
                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, rad);
                gradient.addColorStop(0, colorToString(color, layerAlpha));
                gradient.addColorStop(1, colorToString(color, 0));
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, rad, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawRose(x, y, size, time) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -screenSize || screenX > width + screenSize || 
                screenY < -screenSize || screenY > height + screenSize) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(Math.sin(time * 0.0005) * 0.1);
            
            // Stem
            ctx.strokeStyle = colorToString(colors.purple, 0.6);
            ctx.lineWidth = screenSize * 0.05;
            ctx.beginPath();
            ctx.moveTo(0, screenSize * 0.3);
            ctx.quadraticCurveTo(screenSize * 0.1, screenSize * 0.5, 0, screenSize * 0.8);
            ctx.stroke();
            
            // Petals
            const petalCount = 12;
            for (let i = 0; i < petalCount; i++) {
                const angle = (i / petalCount) * Math.PI * 2 + time * 0.0003;
                const dist = screenSize * (0.15 + Math.sin(time * 0.001 + i) * 0.05);
                const petalSize = screenSize * (0.15 + Math.sin(time * 0.002 + i * 0.5) * 0.03);
                
                ctx.save();
                ctx.rotate(angle);
                ctx.translate(dist, 0);
                
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, petalSize);
                gradient.addColorStop(0, colorToString(colors.softPink, 0.8));
                gradient.addColorStop(0.5, colorToString(colors.lavender, 0.6));
                gradient.addColorStop(1, colorToString(colors.softPink, 0.2));
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(0, 0, petalSize, petalSize * 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            // Center
            drawWatercolorCircle(x, y, size * 0.1, colors.gold, 0.9);
            
            ctx.restore();
        }
        
        function drawPaperAirplane(x, y, size, time) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -screenSize || screenX > width + screenSize || 
                screenY < -screenSize || screenY > height + screenSize) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(Math.sin(time * 0.001) * 0.3 - Math.PI / 4);
            
            // Airplane body
            ctx.fillStyle = colorToString(colors.warmCream, 0.9);
            ctx.strokeStyle = colorToString(colors.lavender, 0.5);
            ctx.lineWidth = screenSize * 0.02;
            
            ctx.beginPath();
            ctx.moveTo(screenSize * 0.4, 0);
            ctx.lineTo(-screenSize * 0.4, screenSize * 0.3);
            ctx.lineTo(-screenSize * 0.4, -screenSize * 0.3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Trail of hearts
            for (let i = 0; i < 5; i++) {
                const trailX = -screenSize * 0.4 - i * screenSize * 0.2;
                const trailY = Math.sin(time * 0.002 + i) * screenSize * 0.1;
                const heartSize = screenSize * 0.08 * (1 - i * 0.15);
                const alpha = 0.6 - i * 0.1;
                
                ctx.fillStyle = colorToString(colors.softPink, alpha);
                ctx.beginPath();
                ctx.arc(trailX - heartSize * 0.25, trailY - heartSize * 0.25, heartSize * 0.5, Math.PI, 0, false);
                ctx.arc(trailX + heartSize * 0.25, trailY - heartSize * 0.25, heartSize * 0.5, Math.PI, 0, false);
                ctx.lineTo(trailX, trailY + heartSize * 0.5);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawLetter(x, y, size, time) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -screenSize || screenX > width + screenSize || 
                screenY < -screenSize || screenY > height + screenSize) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            
            // Paper background
            ctx.fillStyle = colorToString(colors.warmCream, 0.95);
            ctx.strokeStyle = colorToString(colors.gold, 0.3);
            ctx.lineWidth = screenSize * 0.01;
            ctx.fillRect(-screenSize * 0.4, -screenSize * 0.5, screenSize * 0.8, screenSize);
            ctx.strokeRect(-screenSize * 0.4, -screenSize * 0.5, screenSize * 0.8, screenSize);
            
            // Text content
            const lines = [
                "نیایش…",
                "",
                "شاید نتوانم تمام احساسم را",
                "در چند خط بنویسم،",
                "اما اگر این دنیا بی‌انتها باشد،",
                "باز هم برای دوست داشتن تو",
                "کافی نیست.",
                "",
                "تو آرامش تمام روزهای",
                "شلوغ منی.",
                "",
                "تو دلیل لبخندهایی هستی که",
                "حتی خودم متوجهشان نمی‌شوم.",
                "",
                "اگر هزار دنیا وجود داشته باشد،",
                "باز هم همه را انتخاب می‌کنم،",
                "فقط اگر تو در یکی از آن‌ها باشی.",
                "",
                "With all my heart,",
                "Mobin"
            ];
            
            const lineHeight = screenSize * 0.045;
            const startY = -screenSize * 0.45;
            const fontSize = Math.min(screenSize * 0.032, 20);
            
            ctx.fillStyle = colorToString(colors.deepBlue, 0.85);
            ctx.font = `${fontSize}px Georgia`;
            ctx.textAlign = 'center';
            
            const revealProgress = Math.min(1, (time - 2000) / 8000);
            const visibleLines = Math.floor(lines.length * revealProgress);
            
            for (let i = 0; i < visibleLines; i++) {
                const lineAlpha = i === visibleLines - 1 ? (lines.length * revealProgress - visibleLines) : 1;
                ctx.fillStyle = colorToString(colors.deepBlue, 0.85 * lineAlpha);
                ctx.fillText(lines[i], 0, startY + i * lineHeight);
            }
            
            ctx.restore();
        }
        
        function drawCloud(x, y, size, time, seed) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -screenSize || screenX > width + screenSize || 
                screenY < -screenSize || screenY > height + screenSize) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            
            const puffs = 5;
            for (let i = 0; i < puffs; i++) {
                const puffX = (i - puffs / 2) * screenSize * 0.3;
                const puffY = Math.sin(i + time * 0.0005) * screenSize * 0.1;
                const puffSize = screenSize * (0.3 + hash(seed, i) * 0.2);
                
                const gradient = ctx.createRadialGradient(puffX, puffY, 0, puffX, puffY, puffSize);
                gradient.addColorStop(0, colorToString(colors.white, 0.8));
                gradient.addColorStop(0.6, colorToString(colors.lightCyan, 0.5));
                gradient.addColorStop(1, colorToString(colors.white, 0));
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(puffX, puffY, puffSize, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawStar(x, y, size, time, seed) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -100 || screenX > width + 100 || screenY < -100 || screenY > height + 100) return;
            
            const twinkle = 0.5 + Math.sin(time * 0.003 + seed * 10) * 0.5;
            const alpha = twinkle * 0.9;
            
            const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, screenSize * 3);
            gradient.addColorStop(0, colorToString(colors.gold, alpha));
            gradient.addColorStop(0.3, colorToString(colors.warmCream, alpha * 0.5));
            gradient.addColorStop(1, colorToString(colors.gold, 0));
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(screenX, screenY, screenSize * 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Core
            ctx.fillStyle = colorToString(colors.white, alpha);
            ctx.beginPath();
            ctx.arc(screenX, screenY, screenSize, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawButterfly(x, y, size, time, seed) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -screenSize || screenX > width + screenSize || 
                screenY < -screenSize || screenY > height + screenSize) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(Math.sin(time * 0.003 + seed) * 0.3);
            
            const wingFlap = Math.sin(time * 0.01 + seed * 10) * 0.3;
            
            // Left wing
            ctx.save();
            ctx.rotate(-0.3 + wingFlap);
            ctx.fillStyle = colorToString(colors.lavender, 0.7);
            ctx.beginPath();
            ctx.ellipse(-screenSize * 0.3, 0, screenSize * 0.4, screenSize * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = colorToString(colors.purple, 0.5);
            ctx.lineWidth = screenSize * 0.02;
            ctx.stroke();
            ctx.restore();
            
            // Right wing
            ctx.save();
            ctx.rotate(0.3 - wingFlap);
            ctx.fillStyle = colorToString(colors.softPink, 0.7);
            ctx.beginPath();
            ctx.ellipse(screenSize * 0.3, 0, screenSize * 0.4, screenSize * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = colorToString(colors.purple, 0.5);
            ctx.lineWidth = screenSize * 0.02;
            ctx.stroke();
            ctx.restore();
            
            // Body
            ctx.fillStyle = colorToString(colors.deepBlue, 0.8);
            ctx.fillRect(-screenSize * 0.05, -screenSize * 0.4, screenSize * 0.1, screenSize * 0.8);
            
            ctx.restore();
        }
        
        function drawLantern(x, y, size, time, seed) {
            const screenX = (x - camera.x) * camera.zoom + width / 2;
            const screenY = (y - camera.y) * camera.zoom + height / 2;
            const screenSize = size * camera.zoom;
            
            if (screenX < -screenSize || screenX > width + screenSize || 
                screenY < -screenSize || screenY > height + screenSize) return;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(Math.sin(time * 0.001 + seed) * 0.1);
            
            // Glow
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, screenSize * 1.5);
            gradient.addColorStop(0, colorToString(colors.sunsetOrange, 0.6));
            gradient.addColorStop(0.5, colorToString(colors.gold, 0.3));
            gradient.addColorStop(1, colorToString(colors.sunsetOrange, 0));
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, screenSize * 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Lantern body
            ctx.fillStyle = colorToString(colors.warmCream, 0.8);
            ctx.strokeStyle = colorToString(colors.gold, 0.6);
            ctx.lineWidth = screenSize * 0.05;
            ctx.beginPath();
            ctx.ellipse(0, 0, screenSize * 0.6, screenSize * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
                        // String
            ctx.strokeStyle = colorToString(colors.gold, 0.4);
            ctx.lineWidth = screenSize * 0.02;
            ctx.beginPath();
            ctx.moveTo(0, -screenSize * 0.8);
            ctx.lineTo(0, -screenSize * 1.5);
            ctx.stroke();
            
            ctx.restore();
        }
        
        // Main render function
        let time = 0;
        let lastTime = performance.now();
        
        function render(now) {
            requestAnimationFrame(render);
            
            const dt = Math.min(now - lastTime, 100);
            lastTime = now;
            time = now;
            
            // Update camera
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;
            camera.vx *= 0.92;
            camera.vy *= 0.92;
            camera.x += camera.vx;
            camera.y += camera.vy;
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update(dt)) {
                    particles.splice(i, 1);
                }
            }
            
            // Clear canvas with gradient background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, colorToString(colors.deepBlue, 1));
            bgGradient.addColorStop(0.5, colorToString(mixColors(colors.deepBlue, colors.purple, 0.5), 1));
            bgGradient.addColorStop(1, colorToString(colors.purple, 1));
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);
            
            // Get visible area in world space
            const viewLeft = camera.x - width / (2 * camera.zoom);
            const viewRight = camera.x + width / (2 * camera.zoom);
            const viewTop = camera.y - height / (2 * camera.zoom);
            const viewBottom = camera.y + height / (2 * camera.zoom);
            
            const zoomLevel = getZoomLevel();
            
            // Level 0: Initial view - main message and decorations
            if (zoomLevel < 1.5) {
                // Background stars
                for (let i = 0; i < 200; i++) {
                    const sx = (hash(i, 0) - 0.5) * 4000;
                    const sy = (hash(i, 1) - 0.5) * 4000;
                    if (sx < viewLeft || sx > viewRight || sy < viewTop || sy > viewBottom) continue;
                    drawStar(sx, sy, 1, time, i);
                }
                
                // Floating clouds
                for (let i = 0; i < 15; i++) {
                    const cx = (hash(i, 10) - 0.5) * 3000 + Math.sin(time * 0.0001 + i) * 100;
                    const cy = (hash(i, 11) - 0.5) * 2000;
                    if (cx < viewLeft - 200 || cx > viewRight + 200 || cy < viewTop - 200 || cy > viewBottom + 200) continue;
                    drawCloud(cx, cy, 40 + hash(i, 12) * 30, time, i);
                }
                
                // Main title
                drawWatercolorText("برای نیایش", 0, -300, 120, colors.gold, 1);
                drawWatercolorText("For Niayesh", 0, -180, 40, colors.warmCream, 0.8);
                
                // Decorative elements around title
                drawRose(-400, -250, 80, time);
                drawRose(400, -250, 80, time);
                drawPaperAirplane(-200, 0, 60, time);
                drawPaperAirplane(200, 0, 60, time);
                
                // Hearts floating up
                for (let i = 0; i < 10; i++) {
                    const hx = (hash(i, 20) - 0.5) * 800;
                    const hy = 400 + (time * 0.05 + i * 50) % 1200;
                    const hSize = 15 + hash(i, 21) * 15;
                    drawWatercolorCircle(hx, hy, hSize, colors.softPink, 0.6);
                }
                
                // Instruction text
                const instructAlpha = Math.min(1, (time - 1000) / 2000);
                drawWatercolorText("پینچ کن تا سفر شروع بشه", 0, 500, 28, colors.lavender, instructAlpha * 0.9);
                drawWatercolorText("Pinch to zoom and explore", 0, 550, 22, colors.warmCream, instructAlpha * 0.7);
            }
            
            // Level 1: First zoom - romantic scenes
            if (zoomLevel >= 0.8 && zoomLevel < 2.5) {
                const gridSize = 800;
                const startX = Math.floor(viewLeft / gridSize) - 1;
                const endX = Math.floor(viewRight / gridSize) + 1;
                const startY = Math.floor(viewTop / gridSize) - 1;
                const endY = Math.floor(viewBottom / gridSize) + 1;
                
                for (let gx = startX; gx <= endX; gx++) {
                    for (let gy = startY; gy <= endY; gy++) {
                        const seed = hash(gx, gy, 100);
                        const wx = gx * gridSize + (seed - 0.5) * 200;
                        const wy = gy * gridSize + (hash(gx, gy, 101) - 0.5) * 200;
                        
                        if (seed < 0.3) {
                            drawLetter(wx, wy, 200, time);
                        } else if (seed < 0.5) {
                            drawRose(wx, wy, 100, time + gx * 1000);
                        } else if (seed < 0.7) {
                            drawLantern(wx, wy, 60, time, seed);
                        } else {
                            drawButterfly(wx, wy, 40, time, seed);
                        }
                        
                        // Messages
                        const messages = [
                            "هر روز با تو، یک داستان زیبای جدید است",
                            "تو نور زندگی منی",
                            "عشق، وقتی تو باشی معنی پیدا می‌کند",
                            "دنیا با تو رنگارنگ‌تر است",
                            "تو بهترین اتفاق زندگی منی"
                        ];
                        const msgIndex = Math.floor(seed * messages.length);
                        const msgAlpha = 0.3 + Math.sin(time * 0.001 + seed * 10) * 0.2;
                        drawWatercolorText(messages[msgIndex], wx, wy - 150, 18, colors.lavender, msgAlpha);
                    }
                }
            }
            
            // Level 2: Deeper zoom - memory fragments
            if (zoomLevel >= 2 && zoomLevel < 4) {
                const gridSize = 400;
                const startX = Math.floor(viewLeft / gridSize) - 1;
                const endX = Math.floor(viewRight / gridSize) + 1;
                const startY = Math.floor(viewTop / gridSize) - 1;
                const endY = Math.floor(viewBottom / gridSize) + 1;
                
                for (let gx = startX; gx <= endX; gx++) {
                    for (let gy = startY; gy <= endY; gy++) {
                        const seed = hash(gx, gy, 200);
                        const wx = gx * gridSize;
                        const wy = gy * gridSize;
                        
                        // Memory polaroids
                        const screenX = (wx - camera.x) * camera.zoom + width / 2;
                        const screenY = (wy - camera.y) * camera.zoom + height / 2;
                        const polaroidSize = 100 * camera.zoom;
                        
                        if (screenX > -polaroidSize && screenX < width + polaroidSize &&
                            screenY > -polaroidSize && screenY < height + polaroidSize) {
                            
                            ctx.save();
                            ctx.translate(screenX, screenY);
                            ctx.rotate(Math.sin(time * 0.0005 + seed * 10) * 0.2);
                            
                            // Polaroid frame
                            ctx.fillStyle = colorToString(colors.warmCream, 0.95);
                            ctx.shadowColor = 'rgba(0,0,0,0.3)';
                            ctx.shadowBlur = 10;
                            ctx.fillRect(-polaroidSize * 0.4, -polaroidSize * 0.5, polaroidSize * 0.8, polaroidSize);
                            ctx.shadowBlur = 0;
                            
                            // Image area (color block)
                            const imgColors = [colors.lavender, colors.softPink, colors.lightCyan, colors.sunsetOrange];
                            const imgColor = imgColors[Math.floor(seed * imgColors.length)];
                            ctx.fillStyle = colorToString(imgColor, 0.7);
                            ctx.fillRect(-polaroidSize * 0.35, -polaroidSize * 0.45, polaroidSize * 0.7, polaroidSize * 0.6);
                            
                            // Caption
                            const captions = [
                                "First smile",
                                "That day...",
                                "Remember?",
                                "Together",
                                "Forever"
                            ];
                            const caption = captions[Math.floor(seed * captions.length)];
                            ctx.fillStyle = colorToString(colors.deepBlue, 0.8);
                            ctx.font = `${polaroidSize * 0.08}px Georgia`;
                            ctx.textAlign = 'center';
                            ctx.fillText(caption, 0, polaroidSize * 0.3);
                            
                            ctx.restore();
                        }
                        
                        // Floating elements
                        if (seed < 0.3) {
                            drawRose(wx + 50, wy - 80, 30, time + gx * 500);
                        } else if (seed < 0.5) {
                            drawButterfly(wx - 60, wy + 70, 25, time, seed);
                        }
                    }
                }
            }
            
            // Level 3: Microscopic - love molecules
            if (zoomLevel >= 3.5 && zoomLevel < 6) {
                const gridSize = 150;
                const startX = Math.floor(viewLeft / gridSize) - 2;
                const endX = Math.floor(viewRight / gridSize) + 2;
                const startY = Math.floor(viewTop / gridSize) - 2;
                const endY = Math.floor(viewBottom / gridSize) + 2;
                
                for (let gx = startX; gx <= endX; gx++) {
                    for (let gy = startY; gy <= endY; gy++) {
                        const seed = hash(gx, gy, 300);
                        const wx = gx * gridSize + Math.sin(time * 0.0002 + seed * 10) * 30;
                        const wy = gy * gridSize + Math.cos(time * 0.0002 + seed * 15) * 30;
                        
                        // Love atoms
                        const atomColor = seed < 0.5 ? colors.softPink : colors.lavender;
                        drawWatercolorCircle(wx, wy, 20, atomColor, 0.8);
                        
                        // Connections
                        for (let i = -1; i <= 1; i++) {
                            for (let j = -1; j <= 1; j++) {
                                if (i === 0 && j === 0) continue;
                                if (hash(gx + i, gy + j, 300) > seed && Math.abs(i) + Math.abs(j) === 1) {
                                    const nx = (gx + i) * gridSize + Math.sin(time * 0.0002 + hash(gx + i, gy + j, 300) * 10) * 30;
                                    const ny = (gy + j) * gridSize + Math.cos(time * 0.0002 + hash(gx + i, gy + j, 300) * 15) * 30;
                                    
                                    const screenX1 = (wx - camera.x) * camera.zoom + width / 2;
                                    const screenY1 = (wy - camera.y) * camera.zoom + height / 2;
                                    const screenX2 = (nx - camera.x) * camera.zoom + width / 2;
                                    const screenY2 = (ny - camera.y) * camera.zoom + height / 2;
                                    
                                    ctx.strokeStyle = colorToString(colors.gold, 0.3);
                                    ctx.lineWidth = 2 * camera.zoom;
                                    ctx.beginPath();
                                    ctx.moveTo(screenX1, screenY1);
                                    ctx.lineTo(screenX2, screenY2);
                                    ctx.stroke();
                                }
                            }
                        }
                        
                        // Floating words
                        const words = ["Love", "عشق", "♥", "∞", "Soul", "روح"];
                        if (seed < 0.15) {
                            const word = words[Math.floor(hash(gx, gy, 301) * words.length)];
                            drawWatercolorText(word, wx, wy, 12, colors.gold, 0.6);
                        }
                    }
                }
                
                if (zoomLevel >= 4) {
                    const msgAlpha = Math.min(1, (zoomLevel - 4) * 0.5);
                    drawWatercolorText("عشق در هر ذره‌ی وجود ما هست", camera.x, camera.y - 100, 35, colors.warmCream, msgAlpha);
                    drawWatercolorText("Love exists in every particle of our being", camera.x, camera.y + 100, 25, colors.lavender, msgAlpha * 0.8);
                }
            }
            
            // Level 4: Quantum realm - infinite love
            if (zoomLevel >= 5.5 && zoomLevel < 8) {
                const gridSize = 60;
                const startX = Math.floor(viewLeft / gridSize) - 3;
                const endX = Math.floor(viewRight / gridSize) + 3;
                const startY = Math.floor(viewTop / gridSize) - 3;
                const endY = Math.floor(viewBottom / gridSize) + 3;
                
                // Energy field
                for (let gx = startX; gx <= endX; gx++) {
                    for (let gy = startY; gy <= endY; gy++) {
                        const seed = hash(gx, gy, 400);
                        const wx = gx * gridSize;
                        const wy = gy * gridSize;
                        const energy = Math.sin(time * 0.003 + seed * 20) * 0.5 + 0.5;
                        
                        const colorMix = mixColors(colors.gold, colors.purple, energy);
                        drawWatercolorCircle(wx, wy, 8, colorMix, 0.7 * energy);
                        
                        // Quantum entanglement lines
                        if (seed < 0.2) {
                            const targetX = wx + (hash(gx, gy, 401) - 0.5) * 200;
                            const targetY = wy + (hash(gx, gy, 402) - 0.5) * 200;
                            
                            const screenX1 = (wx - camera.x) * camera.zoom + width / 2;
                            const screenY1 = (wy - camera.y) * camera.zoom + height / 2;
                            const screenX2 = (targetX - camera.x) * camera.zoom + width / 2;
                            const screenY2 = (targetY - camera.y) * camera.zoom + height / 2;
                            
                            const gradient = ctx.createLinearGradient(screenX1, screenY1, screenX2, screenY2);
                            gradient.addColorStop(0, colorToString(colors.gold, 0.5 * energy));
                            gradient.addColorStop(1, colorToString(colors.purple, 0));
                            
                            ctx.strokeStyle = gradient;
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.moveTo(screenX1, screenY1);
                            ctx.lineTo(screenX2, screenY2);
                            ctx.stroke();
                        }
                    }
                }
                
                if (zoomLevel >= 6.5) {
                    const msgAlpha = Math.min(1, (zoomLevel - 6.5) * 0.7);
                    drawWatercolorText("ما در سطح کوانتومی به هم متصلیم", camera.x, camera.y - 50, 28, colors.gold, msgAlpha);
                    drawWatercolorText("We are connected at the quantum level", camera.x, camera.y + 50, 20, colors.lavender, msgAlpha * 0.8);
                }
            }
            
            // Level 5: Cosmic scale - universal love
            if (zoomLevel >= 7.5) {
                const gridSize = 25;
                const startX = Math.floor(viewLeft / gridSize) - 5;
                const endX = Math.floor(viewRight / gridSize) + 5;
                const startY = Math.floor(viewTop / gridSize) - 5;
                const endY = Math.floor(viewBottom / gridSize) + 5;
                
                // Cosmic dust
                for (let gx = startX; gx <= endX; gx++) {
                    for (let gy = startY; gy <= endY; gy++) {
                        const seed = hash(gx, gy, 500);
                        const wx = gx * gridSize + Math.sin(time * 0.0001 + seed * 50) * 10;
                        const wy = gy * gridSize + Math.cos(time * 0.0001 + seed * 60) * 10;
                        
                        const twinkle = 0.3 + Math.sin(time * 0.005 + seed * 100) * 0.7;
                        const size = 2 + hash(gx, gy, 501) * 3;
                        
                        drawStar(wx, wy, size, time, seed);
                        
                        // Nebula clouds
                        if (seed < 0.05) {
                            const nebulaColors = [colors.purple, colors.softPink, colors.lavender, colors.deepBlue];
                            const nebulaColor = nebulaColors[Math.floor(hash(gx, gy, 502) * nebulaColors.length)];
                            drawWatercolorCircle(wx, wy, 30 + hash(gx, gy, 503) * 20, nebulaColor, 0.3);
                        }
                    }
                }
                
                // Final messages at extreme zoom
                if (zoomLevel >= 9) {
                    const msgAlpha = Math.min(1, (zoomLevel - 9) * 0.3);
                    drawWatercolorText("عشق ما بی‌نهایت است", camera.x, camera.y - 80, 40, colors.gold, msgAlpha);
                    drawWatercolorText("Our love is infinite", camera.x, camera.y, 32, colors.warmCream, msgAlpha);
                    drawWatercolorText("∞", camera.x, camera.y + 80, 60, colors.lavender, msgAlpha);
                }
                
                if (zoomLevel >= 11) {
                    const msgAlpha = Math.min(1, (zoomLevel - 11) * 0.3);
                    drawWatercolorText("و هر چه بیشتر نگاه کنی", camera.x, camera.y - 150, 28, colors.lightCyan, msgAlpha);
                    drawWatercolorText("بیشتر می‌بینی", camera.x, camera.y - 110, 28, colors.lightCyan, msgAlpha);
                    drawWatercolorText("که این سفر پایانی ندارد", camera.x, camera.y + 110, 28, colors.softPink, msgAlpha);
                    drawWatercolorText("The deeper you look,", camera.x, camera.y + 150, 22, colors.lavender, msgAlpha * 0.8);
                    drawWatercolorText("the more you'll see this journey never ends", camera.x, camera.y + 180, 22, colors.lavender, msgAlpha * 0.8);
                }
            }
            
            // Render particles
            particles.forEach(p => p.render(ctx, camera));
            
            // Add particles occasionally
            if (Math.random() < 0.05 && particles.length < 100) {
                const px = camera.x + (Math.random() - 0.5) * (width / camera.zoom);
                const py = camera.y + (Math.random() - 0.5) * (height / camera.zoom);
                addParticles(px, py, 3, colors.gold);
            }
            
            // Update UI
            ui.innerHTML = `Zoom: ${camera.zoom.toFixed(2)}x | Level: ${zoomLevel.toFixed(1)} | Particles: ${particles.length}`;
        }
        
        requestAnimationFrame(render);
    </script>
</body>
</html>
